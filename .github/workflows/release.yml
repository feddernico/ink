name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if ink-app.html changed
        id: check_changes
        run: |
          # Get the list of files changed in the latest commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files: $CHANGED_FILES"
          if echo "$CHANGED_FILES" | grep -q "ink-app.html"; then
            echo "ink-app.html has changed"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "ink-app.html has NOT changed"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_changes.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.check_changes.outputs.changed == 'true'
        run: npm run build

      - name: Run tests
        if: steps.check_changes.outputs.changed == 'true'
        run: npm test

      - name: Determine next release version
        if: steps.check_changes.outputs.changed == 'true'
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true

      - name: Sync package metadata to release version
        if: steps.check_changes.outputs.changed == 'true' && steps.version.outputs.new_version != '' && steps.version.outputs.new_version != 'undefined'
        run: npm version "${{ steps.version.outputs.new_version }}" --no-git-tag-version --allow-same-version

      - name: Commit version files
        if: steps.check_changes.outputs.changed == 'true' && steps.version.outputs.new_version != '' && steps.version.outputs.new_version != 'undefined'
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): ${{ steps.version.outputs.new_tag }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create release tag
        if: steps.check_changes.outputs.changed == 'true' && steps.version.outputs.new_tag != '' && steps.version.outputs.new_tag != 'undefined'
        run: |
          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      - name: Create Release
        if: steps.check_changes.outputs.changed == 'true' && steps.version.outputs.new_tag != '' && steps.version.outputs.new_tag != 'undefined'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Release ${{ steps.version.outputs.new_tag }}
          files: ink-app.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
