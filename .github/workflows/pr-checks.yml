name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run QUnit tests
        run: npm run test:qunit

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          start: npm run serve:test
          wait-on: 'http://127.0.0.1:4173/ink-app.html'
          browser: chrome
          headless: true
          config: video=false

      - name: Upload Cypress Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Update repomix
        run: npx repomix@latest

      - name: Commit repomix output
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update repomix output"
          file_pattern: "repomix-output.xml"
